# Builds and pushes the versioned CI image to GHCR whenever the Dockerfile
# changes on the main branch, or on manual dispatch.
#
# The resulting image is used by hardware-independent-tests.yml so that PR jobs
# skip expensive apt/rosdep setup during normal runs.
#
# Image: ghcr.io/<owner>/ros2-vlm-demo-ci:jazzy
#
# Approval note: workflow-file changes on PRs from forks or bot-authored commits
# require a maintainer to approve the first run via the "Approve and run" button
# in the Actions UI.  This is a GitHub security policy that cannot be removed.
# Normal same-repository PRs that do not touch workflow files run automatically.

name: build-ci-image

on:
  push:
    branches: [main]
    paths:
      - '.github/docker/Dockerfile.ci'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/Dockerfile.ci
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ros2-vlm-demo-ci:jazzy
            ghcr.io/${{ github.repository_owner }}/ros2-vlm-demo-ci:jazzy-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
