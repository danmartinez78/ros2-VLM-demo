name: hardware-independent-tests

# Approval note: GitHub requires a maintainer to approve the first workflow run
# for pull requests from forks and for any PR that modifies workflow files
# (including those authored by bots such as Copilot).  This is a platform
# security policy ("action_required") that cannot be disabled.  Normal
# same-repository PRs that do not touch workflow files run automatically.
#
# CI image: ghcr.io/<owner>/ros2-vlm-demo-ci:jazzy
# Built by the ensure-ci-image job below before ipc-and-node-tests runs.
# The image pre-installs all stable apt dependencies so the build step
# does not repeat expensive apt/rosdep setup on every PR.
# On the first run (or after Dockerfile changes) the image is built from
# scratch using GitHub Actions layer cache; subsequent PRs reuse the cache.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # Build and push the CI image whenever the Dockerfile changes; all other runs
  # hit the GitHub Actions layer cache and complete in seconds.
  ensure-ci-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      image: ${{ steps.image-ref.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push CI image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/Dockerfile.ci
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ros2-vlm-demo-ci:jazzy
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image ref
        id: image-ref
        run: echo "image=ghcr.io/${{ github.repository_owner }}/ros2-vlm-demo-ci:jazzy" >> "$GITHUB_OUTPUT"

  ipc-and-node-tests:
    runs-on: ubuntu-24.04
    needs: ensure-ci-image
    timeout-minutes: 15
    container:
      image: ${{ needs.ensure-ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root

    defaults:
      run:
        shell: bash

    env:
      DEBIAN_FRONTEND: noninteractive
      ROS_DISTRO: jazzy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install only the package's own rosdep keys (not the stable apt deps,
      # which are already baked into the CI image).  Bounded to 3 minutes so a
      # mirror stall does not silently consume the job timeout.
      - name: Install package rosdep dependencies
        timeout-minutes: 3
        run: |
          rosdep update --rosdistro "${ROS_DISTRO}"
          rosdep install \
            --from-paths . \
            --ignore-src \
            --rosdistro "${ROS_DISTRO}" \
            -y \
            --skip-keys "libopencv-dev qtbase5-dev image_transport pluginlib rviz_common message_filters vision_msgs"
          rm -rf /var/lib/apt/lists/*

      # Full Thor-representative build: all production and test targets.
      # --symlink-install matches the Jetson Thor build procedure.
      - name: Build package (colcon)
        run: |
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          colcon build \
            --packages-select edge_vlm_ros \
            --symlink-install \
            --cmake-args -DBUILD_TESTING=ON

      - name: Verify RViz plugin library
        run: test -f build/edge_vlm_ros/libedge_vlm_rviz_panel.so

      - name: Run hardware-independent tests
        run: |
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          source install/setup.bash
          colcon test --packages-select edge_vlm_ros \
            --ctest-args \
              -R "test_(frame_sampling|node|rviz_formatting|ipc_protocol|ipc_inference_backend|inference_watchdog|latest_value_stage|iou_tracker|tracked_observation_adapter|worker_recovery_helpers|ultralytics_yolo_launch)" \
              --output-on-failure

      - name: Publish test results
        if: always()
        run: |
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          if [[ -f install/setup.bash ]]; then
            source install/setup.bash
          fi
          if [[ -d build ]]; then
            colcon test-result --verbose
          else
            echo "No build directory; test results are unavailable."
          fi

  yolo-adapter-tests:
    runs-on: ubuntu-24.04
    needs: ensure-ci-image
    timeout-minutes: 15
    container:
      image: ${{ needs.ensure-ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root

    defaults:
      run:
        shell: bash

    env:
      DEBIAN_FRONTEND: noninteractive
      ROS_DISTRO: jazzy
      YOLO_ROS_SHA: e712bdee9c5fcffb5e42a17b28792de004224964

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout pinned yolo_msgs sources
        uses: actions/checkout@v4
        with:
          repository: mgonzs13/yolo_ros
          ref: ${{ env.YOLO_ROS_SHA }}
          path: external/yolo_ros
          sparse-checkout: |
            yolo_msgs

      - name: Install package rosdep dependencies
        timeout-minutes: 3
        run: |
          rosdep update --rosdistro "${ROS_DISTRO}"
          rosdep install \
            --from-paths . external/yolo_ros/yolo_msgs \
            --ignore-src \
            --rosdistro "${ROS_DISTRO}" \
            -y \
            --skip-keys "libopencv-dev qtbase5-dev image_transport pluginlib rviz_common message_filters vision_msgs"
          rm -rf /var/lib/apt/lists/*

      - name: Build YOLO adapter path (colcon)
        run: |
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          colcon build \
            --base-paths external/yolo_ros/yolo_msgs \
            --packages-select yolo_msgs \
            --symlink-install
          source install/setup.bash
          colcon build \
            --packages-select edge_vlm_ros \
            --symlink-install \
            --cmake-args -DBUILD_TESTING=ON

      - name: Verify YOLO adapter executable
        run: test -f install/edge_vlm_ros/lib/edge_vlm_ros/edge_vlm_yolo_detection2d_adapter

      - name: Run YOLO adapter test
        run: |
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          source install/setup.bash
          colcon test --packages-select edge_vlm_ros \
            --ctest-args \
              -R "test_yolo_detection2d_adapter" \
              --output-on-failure

      - name: Publish test results
        if: always()
        run: |
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          if [[ -f install/setup.bash ]]; then
            source install/setup.bash
          fi
          if [[ -d build ]]; then
            colcon test-result --verbose
          else
            echo "No build directory; test results are unavailable."
          fi

  benchmark-parser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run benchmark parser and schema tests (CPU-only, no hardware required)
        run: |
          python3 scripts/benchmark/test_benchmark_parsers.py -v
          python3 scripts/benchmark/test_observation_history_summary.py -v
          bash -n scripts/benchmark/run_observation_history_experiment.sh
          bash -n scripts/test_data/run_image_proc_test.sh
          bash -n scripts/experiment_stack.sh

  web-console-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run web console tests (CPU-only, no hardware required)
        run: python3 web_console/tests/test_web_console.py -v

  obsolete-identifier-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject obsolete generic infrastructure identifiers
        run: bash scripts/check_obsolete_identifiers.sh
