name: hardware-independent-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ipc-and-node-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install dependencies
        run: |
          rosdep update
          rosdep install --from-paths . --ignore-src -r -y

      - name: Build package
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select cosmos_ros2_video_reasoner --cmake-args -DBUILD_TESTING=ON

      - name: Run hardware-independent tests
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --packages-select cosmos_ros2_video_reasoner \
            --ctest-args -R "test_(frame_sampling|node|ipc_protocol|ipc_inference_backend)" --output-on-failure

      - name: Publish test results
        if: always()
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test-result --verbose
