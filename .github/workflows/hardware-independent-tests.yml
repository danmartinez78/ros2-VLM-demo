name: hardware-independent-tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ipc-and-node-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ros:jazzy-ros-base-noble

    defaults:
      run:
        shell: bash

    env:
      DEBIAN_FRONTEND: noninteractive
      ROS_DISTRO: jazzy

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install package dependencies
        run: |
          apt-get update
          apt-get install --no-install-recommends --yes \
            libopencv-dev \
            python3-colcon-common-extensions \
            python3-rosdep \
            qtbase5-dev \
            ros-jazzy-pluginlib \
            ros-jazzy-rviz-common
          rosdep update --rosdistro "${ROS_DISTRO}"
          rosdep install \
            --from-paths . \
            --ignore-src \
            --rosdistro "${ROS_DISTRO}" \
            -y
          rm -rf /var/lib/apt/lists/*

      - name: Build package
        run: |
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          colcon build \
            --packages-select edge_vlm_ros \
            --cmake-args -DBUILD_TESTING=ON
          test -f build/edge_vlm_ros/libedge_vlm_rviz_panel.so

      - name: Run hardware-independent tests
        run: |
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          source install/setup.bash
          colcon test --packages-select edge_vlm_ros \
            --ctest-args \
              -R "test_(frame_sampling|node|rviz_formatting|ipc_protocol|ipc_inference_backend|inference_watchdog|worker_recovery_helpers)" \
              --output-on-failure

      - name: Publish test results
        if: always()
        run: |
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          if [[ -f install/setup.bash ]]; then
            source install/setup.bash
          fi
          if [[ -d build ]]; then
            colcon test-result --verbose
          else
            echo "No build directory; test results are unavailable."
          fi

  benchmark-parser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run benchmark parser and schema tests (CPU-only, no hardware required)
        run: |
          python3 scripts/benchmark/test_benchmark_parsers.py -v
          python3 scripts/benchmark/test_observation_history_summary.py -v
          bash -n scripts/benchmark/run_observation_history_experiment.sh
          bash -n scripts/test_data/run_image_proc_test.sh
          bash -n scripts/experiment_stack.sh

  web-console-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run web console tests (CPU-only, no hardware required)
        run: python3 web_console/tests/test_web_console.py -v

  obsolete-identifier-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reject obsolete generic infrastructure identifiers
        run: bash scripts/check_obsolete_identifiers.sh
