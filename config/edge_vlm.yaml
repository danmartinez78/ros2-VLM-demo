# edge_vlm_ros — default parameters
#
# Copy to your workspace or override via launch arguments.
# All path parameters must be absolute (~ is not expanded by rclcpp::Node).

edge_vlm_ros_node:
  ros__parameters:
    # ── Topics ────────────────────────────────────────────────────────────────
    image_topic: /camera/image_raw
    worker_socket_path: /tmp/edge_vlm.sock
    worker_connect_timeout_seconds: 120
    worker_request_timeout_seconds: 90
    # Note: worker_inference_deadline_seconds (default 60 s) is a worker binary
    # launch argument, not a ROS parameter.  Configure it via:
    #   ros2 launch ... worker_inference_deadline_seconds:=60
    # It must be less than worker_request_timeout_seconds so the worker self-
    # terminates before the client-side SO_RCVTIMEO fires.
    result_topic: /vlm/result

    # ── Engine paths (REQUIRED on hardware — set absolute paths) ─────────────
    # Example:
    #   llm_engine_dir: /home/nvidia/tensorrt-edgellm-workspace/Cosmos-Reason2-2B/engine/llm
    #   multimodal_engine_dir: /home/nvidia/tensorrt-edgellm-workspace/Cosmos-Reason2-2B/engine
    #   edge_llm_plugin_path: /home/nvidia/TensorRT-Edge-LLM/build/libNvInfer_edgellm_plugin.so
    llm_engine_dir: ""
    multimodal_engine_dir: ""
    edge_llm_plugin_path: ""

    # ── VLM prompt ────────────────────────────────────────────────────────────
    prompt: >
      Describe the scene in this camera frame. Identify important objects,
      people, animals, vehicles, terrain, hazards, and unusual conditions.
      Do not claim details that are not visually supported.
    task_profile: legacy_prompt
    prompt_version: v1

    task_profiles:
      scene_description:
        template: >
          Describe the scene in this camera frame. Identify important objects,
          people, animals, vehicles, terrain, hazards, and unusual conditions.
          Do not claim details that are not visually supported.
      hazard_detection:
        template: >
          Detect hazards in this camera frame. Focus on immediate risks to people,
          vehicles, and infrastructure. Report only visually supported hazards.
      inventory:
        template: >
          Identify visible inventory items in this camera frame. Summarize counts,
          locations, and notable missing or misplaced items based only on visible evidence.
      navigation_assistance:
        template: >
          Provide navigation assistance from this camera frame. Describe traversable
          space, obstacles, signage, and safe next-step guidance using only visible cues.

    # Optional template variables:
    #   {system_instruction} {task_instruction} {context}
    #   {source_topic} {sample_period_seconds} {frame_sequence}
    system_instruction: ""
    task_instruction: ""
    # instruction_delivery_mode: inline — legacy flat prompt; all fields concatenated
    #   into a single user message.  The {system_instruction} and {context} template
    #   variables are expanded inline.
    # instruction_delivery_mode: structured — native Edge-LLM message roles.
    #   system_instruction → system Message; task prompt → user Message;
    #   retained history → prior (user, assistant) turn pairs.
    #   The {system_instruction} and {context} template variables are suppressed
    #   (they expand to empty strings) since those roles are delivered separately.
    instruction_delivery_mode: inline
    # enable_system_prompt_cache: opt-in system-prompt caching for stable, identical
    # system prompts.  Only valid with instruction_delivery_mode: structured and a
    # non-empty system_instruction.  Cache keys are derived from the system prompt
    # text (and LoRA identity where applicable); they live in device memory and do
    # not persist across worker restarts.  Multimodal system prompts are not cached.
    # Requires validation on Thor with the pinned TensorRT Edge-LLM version before
    # enabling.  Silently ignored when the runtime does not support caching.
    enable_system_prompt_cache: false
    observation_history_max_entries: 0
    observation_history_max_chars: 0
    observation_history_reset_policy: never
    observation_history_reset_interval_requests: 0

    # ── Sampling ──────────────────────────────────────────────────────────────
    # Time between frames sent for inference (uses ROS message timestamp,
    # so bag replay at any speed remains deterministic).
    sample_period_seconds: 2.0

    # ── Inference parameters ──────────────────────────────────────────────────
    max_generate_length: 256
    temperature: 0.2
    top_p: 0.9
    top_k: 20

    # ── Image preprocessing ───────────────────────────────────────────────────
    image_max_width: 1280
    jpeg_quality: 90

    # ── Queue / drop policy ───────────────────────────────────────────────────
    queue_capacity: 1
    drop_old_frames: true

    # ── Output ────────────────────────────────────────────────────────────────
    publish_results: true

    # ── Profiling (developer option) ──────────────────────────────────────────
    dump_profile: false
    profile_output_directory: /tmp/edge_vlm_ros_profiles
